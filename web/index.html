<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DeKYC — self-sovereign KYC on Ethereum. Encrypt once, verify anywhere.">

  <!--
    Content-Security-Policy: defence-in-depth for the document renderer. The app
    fetches encrypted bundles from an IPFS gateway (the CID is untrusted
    on-chain data) and renders decrypted PDFs in a blob: iframe. This policy
    contains that surface:
      object-src 'none'   kills <embed>/<object> abuse
      base-uri 'self'     blocks <base> hijacking
      frame-src 'self' blob:  restricts iframes to our own previews
    None of those depend on script-src, so the PDF-viewer containment holds
    regardless of what follows.

    Why script-src carries 'unsafe-inline':
    Flutter's DEBUG bootstrap (`flutter run -d chrome`, DDC) loads the app via
    an INLINE <script>. Without 'unsafe-inline' the browser blocks it and the
    page renders permanently blank — i.e. the strict policy silently broke the
    exact command the README tells contributors to run. Release builds do not
    need it (their bootstrap only creates external <script src> tags, verified
    against this policy), so a production deployment should drop it.

    Recommended for production: build with `flutter build web --csp`, remove
    this meta tag, and serve the policy as a real CSP response header without
    'unsafe-inline' — a header is also the only place a per-request nonce can
    be injected. A meta tag cannot do either.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss: data: blob:; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DeKYC">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DeKYC</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
