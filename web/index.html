<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DeKYC — self-sovereign KYC on Ethereum. Encrypt once, verify anywhere.">

  <!--
    Content-Security-Policy: defense-in-depth for the document renderer. The app
    fetches encrypted bundles from an IPFS gateway (CID is untrusted on-chain
    data) and renders decrypted PDFs in a blob: iframe. This policy contains that
    surface: object-src 'none' kills <embed>/<object> abuse, base-uri 'self'
    blocks <base> hijacking, and frame-src restricts iframes to our own blob:
    previews. script-src/connect-src stay permissive because Flutter's CanvasKit
    wasm bootstrap and the WalletConnect (wss) / RPC / Pinata (https) calls need
    them — tighten these further only with a full runtime re-test.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss: data: blob:; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DeKYC">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DeKYC</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
